name: Build

# Every branch is built, not only main: work in progress lives on topic branches and is merged to main
# only as a finished unit, so the build has to be able to vouch for a branch before the merge.
on:
  push:
    branches: ['**']
    paths: ['src/**', 'tests/**', 'Directory.Build.props', 'Directory.Packages.props', 'Pulsa.slnx', 'global.json', '.github/workflows/build.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'Directory.Build.props', 'Directory.Packages.props', 'Pulsa.slnx', 'global.json', '.github/workflows/build.yml']
  workflow_dispatch:
# The paths are what the build reads: the sources and tests, and the shared build settings at the repository root.

# A branch that is pushed again, or that also has a pull request, builds once.
concurrency:
  group: build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dotnet-restore-cache

      - name: Build
        run: dotnet build Pulsa.slnx -c Release

      # The live tests of PulsaMedia need a real ffmpeg on PATH; don't rely on assumptions
      # about what windows-latest ships. Chocolatey is preinstalled on GitHub's windows-latest
      # runners, so this has no extra action dependency to keep current/trusted (vs. a third-party
      # setup-ffmpeg action). Its community feed now and then answers 5xx, and `choco install` then
      # ends "installed 0/0 packages" with a success code — so the step retries, and fails itself
      # when there is still no ffmpeg, instead of letting the tests fail on a missing binary.
      - name: Install ffmpeg
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "ffmpeg is not installed (attempt $attempt of 5)"
            Start-Sleep -Seconds (20 * $attempt)
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw 'ffmpeg could not be installed' }
          ffmpeg -version | Select-Object -First 1

      - name: Test
        run: dotnet test Pulsa.slnx -c Release --no-build
