name: Build

# Every branch is built, not only main: work in progress lives on topic branches and is merged to main
# only as a finished unit, so the build has to be able to vouch for a branch before the merge.
on:
  push:
    branches: ['**']
    paths: ['src/**', 'tests/**']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**']
  workflow_dispatch:

# A branch that is pushed again, or that also has a pull request, builds once.
concurrency:
  group: build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dotnet-restore-cache

      - name: Build
        run: dotnet build Pulsa.slnx -c Release

      # Pulsa.Redact.SDK.Tests' live tests need a real ffmpeg on PATH; don't rely on assumptions
      # about what windows-latest ships. Chocolatey is preinstalled on GitHub's windows-latest
      # runners, so this has no extra action dependency to keep current/trusted (vs. a third-party
      # setup-ffmpeg action).
      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Test
        run: dotnet test Pulsa.slnx -c Release --no-build
