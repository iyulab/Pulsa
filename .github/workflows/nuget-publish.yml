name: NuGet Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/core/Pulsa/Pulsa.csproj'
      - 'src/sdk/Pulsa.VideoCompose.SDK/PulsaVideoCompose.SDK.csproj'
      - 'src/sdk/Pulsa.Redact.SDK/PulsaRedact.SDK.csproj'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      pulsa: ${{ steps.pulsa.outputs.publish }}
      video-compose-sdk: ${{ steps.video-compose-sdk.outputs.publish }}
      redact-sdk: ${{ steps.redact-sdk.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Pulsa
        id: pulsa
        shell: bash
        run: |
          csproj="src/core/Pulsa/Pulsa.csproj"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || git diff HEAD~1 HEAD --name-only | grep -q "$csproj"; then
            version=$(sed -n 's/.*<Version>\([^<]*\)<.*/\1/p' "$csproj")
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=${version}" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Check PulsaVideoCompose.SDK
        id: video-compose-sdk
        shell: bash
        run: |
          csproj="src/sdk/Pulsa.VideoCompose.SDK/PulsaVideoCompose.SDK.csproj"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || git diff HEAD~1 HEAD --name-only | grep -q "$csproj"; then
            version=$(sed -n 's/.*<Version>\([^<]*\)<.*/\1/p' "$csproj")
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=${version}" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Check PulsaRedact.SDK
        id: redact-sdk
        shell: bash
        run: |
          csproj="src/sdk/Pulsa.Redact.SDK/PulsaRedact.SDK.csproj"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || git diff HEAD~1 HEAD --name-only | grep -q "$csproj"; then
            version=$(sed -n 's/.*<Version>\([^<]*\)<.*/\1/p' "$csproj")
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=${version}" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

  publish-pulsa:
    needs: detect-changes
    if: needs.detect-changes.outputs.pulsa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dotnet-restore-cache

      - name: Pack
        run: dotnet pack src/core/Pulsa/Pulsa.csproj -c Release -o nupkgs

      - name: Push to NuGet
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # PulsaVideoCompose.SDK's packed nuspec carries a hard `<dependency id="Pulsa">` (via its
  # ProjectReference to src/core/Pulsa) — it must not be pushed to nuget.org ahead of a Pulsa
  # version bump that has actually been published, or the published SDK becomes unresolvable.
  # CORRECTNESS PRECONDITION (2026-09-04): nuget.org's existing `Pulsa 0.1.0` (published
  # 2026-03-19) is NOT this project — it's the old FileWatcher-era Pulsa, a different library
  # that happens to share this id+version by coincidence. `publish-pulsa`'s `--skip-duplicate`
  # will silently no-op against it forever. Before the FIRST real publish of either package,
  # bump src/core/Pulsa/Pulsa.csproj's <Version> (e.g. 0.1.0 -> 0.1.1) so this job actually
  # pushes the real (AI-abstraction-conduit) Pulsa, not a duplicate-check against a stranger.
  # needs publish-pulsa with success-or-skipped so this still runs standalone once Pulsa's own
  # version has already been correctly published and only the SDK itself changes afterward.
  publish-video-compose-sdk:
    needs: [detect-changes, publish-pulsa]
    if: always() && needs.detect-changes.outputs.video-compose-sdk == 'true' && (needs.publish-pulsa.result == 'success' || needs.publish-pulsa.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dotnet-restore-cache

      - name: Pack
        run: dotnet pack src/sdk/Pulsa.VideoCompose.SDK/PulsaVideoCompose.SDK.csproj -c Release -o nupkgs

      - name: Push to NuGet
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # PulsaRedact.SDK carries the same hard `<dependency id="Pulsa">` (ProjectReference to
  # src/core/Pulsa) as PulsaVideoCompose.SDK above — same precondition, same success-or-skipped
  # dependency on publish-pulsa.
  publish-redact-sdk:
    needs: [detect-changes, publish-pulsa]
    if: always() && needs.detect-changes.outputs.redact-sdk == 'true' && (needs.publish-pulsa.result == 'success' || needs.publish-pulsa.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dotnet-restore-cache

      - name: Pack
        run: dotnet pack src/sdk/Pulsa.Redact.SDK/PulsaRedact.SDK.csproj -c Release -o nupkgs

      - name: Push to NuGet
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
